org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Drapeaux de compatibilité AGP 9 (repris du template Flutter 3.50) :
# conservent l'ancien DSL et l'application explicite du plugin Kotlin pour
# les plugins Flutter tiers (Agora, LiveKit, callkit, overlay…) pas encore
# migrés vers le nouveau DSL / Kotlin intégré d'AGP 9.
android.newDsl=false
android.builtInKotlin=false
# AGP 9 a basculé ces défauts ; on conserve le comportement AGP 8 :
# - les AAR natifs Agora (iris-rtc, agora-special-full, iris-rtm) partagent le
#   namespace `io.agora.rtc` → l'unicité stricte casse la fusion du manifeste.
android.uniquePackageNames=false
# - mode strict R8 : `-keep class A` ne garderait plus le constructeur par
#   défaut → crash RUNTIME possible en release (réflexion Agora/Firebase/
#   Sentry/callkit) sans aucun échec de build. Garde la sémantique AGP 8.
android.r8.strictFullModeForKeepRules=false
# - shrinking ressources « optimisé » R8 : peut retirer des ressources chargées
#   dynamiquement (icônes notif, etc.). Garde le shrinker AGP 8.
android.r8.optimizedResourceShrinking=false
